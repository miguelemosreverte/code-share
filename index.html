<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code-share</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root { --bg: #212121; --bar: #1a1a1a; --fg: #eeeeee; --muted: #9e9e9e; --accent: #82aaff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 16px; background: var(--bar); }
  header strong { margin-right: auto; }
  select, button { background: #2c2c2c; color: var(--fg); border: 1px solid #444; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  #status { color: var(--muted); font-size: 12px; min-width: 70px; text-align: right; }
  #status.live { color: #c3e88d; }
  main { flex: 1; min-height: 0; }
  .CodeMirror { height: 100%; font: 15px/1.5 ui-monospace, "JetBrains Mono", Menlo, monospace; }
</style>
</head>
<body>
<header>
  <strong>code-share</strong>
  <select id="lang" aria-label="Language">
    <option value="text/x-scala">Scala</option>
    <option value="text/x-haskell">Haskell</option>
  </select>
  <button id="new">New</button>
  <button id="copy">Copy link</button>
  <span id="status">connecting…</span>
</header>
<main><textarea id="code"></textarea></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/haskell/haskell.min.js"></script>
<script>
// Snippets live at /code-share/snippets/<id> in the shared Realtime Database.
// Reads stream over Server-Sent Events, writes are debounced REST PUTs: no SDK, no login.
const DB = 'https://signaling-dcfad-default-rtdb.europe-west1.firebasedatabase.app/code-share/snippets';
const MAX_CHARS = 100000;
const WRITE_DELAY_MS = 120;
const clientId = Math.random().toString(36).slice(2);

const randomId = () => Math.random().toString(36).slice(2, 10);
const validId = id => /^[a-z0-9]{4,32}$/.test(id);

let snippetId = location.hash.slice(1);
if (!validId(snippetId)) { snippetId = randomId(); history.replaceState(null, '', '#' + snippetId); }

const status = document.getElementById('status');
const lang = document.getElementById('lang');
const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
  mode: 'text/x-scala', theme: 'material-darker', lineNumbers: true,
  indentUnit: 2, tabSize: 2, autofocus: true,
});

let applyingRemote = false;
let writeTimer = null;
let stream = null;

function setStatus(text, live) { status.textContent = text; status.classList.toggle('live', !!live); }

function save() {
  clearTimeout(writeTimer);
  writeTimer = setTimeout(() => {
    const code = editor.getValue().slice(0, MAX_CHARS);
    fetch(`${DB}/${snippetId}.json`, {
      method: 'PUT',
      body: JSON.stringify({ code, lang: lang.value, by: clientId, at: { '.sv': 'timestamp' } }),
    }).then(r => setStatus(r.ok ? 'saved' : 'save failed', r.ok))
      .catch(() => setStatus('offline'));
  }, WRITE_DELAY_MS);
}

function applyRemote(snippet) {
  if (!snippet || snippet.by === clientId) return;
  applyingRemote = true;
  if (snippet.lang && snippet.lang !== lang.value) { lang.value = snippet.lang; editor.setOption('mode', snippet.lang); }
  if (typeof snippet.code === 'string' && snippet.code !== editor.getValue()) {
    const cursor = editor.getCursor();
    const scroll = editor.getScrollInfo();
    editor.setValue(snippet.code);
    editor.setCursor(cursor);
    editor.scrollTo(scroll.left, scroll.top);
  }
  applyingRemote = false;
}

function listen() {
  if (stream) stream.close();
  stream = new EventSource(`${DB}/${snippetId}.json`);
  stream.addEventListener('put', e => {
    const { path, data } = JSON.parse(e.data);
    if (path === '/') applyRemote(data);
    setStatus('live', true);
  });
  stream.addEventListener('patch', () => setStatus('live', true));
  stream.onerror = () => setStatus('reconnecting…');
}

editor.on('change', () => { if (!applyingRemote) save(); });
lang.addEventListener('change', () => { editor.setOption('mode', lang.value); save(); });

document.getElementById('new').addEventListener('click', () => {
  location.hash = randomId();
});
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(location.href); setStatus('link copied', true); }
  catch { prompt('Copy this link:', location.href); }
});
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (!validId(id) || id === snippetId) return;
  snippetId = id;
  applyingRemote = true; editor.setValue(''); applyingRemote = false;
  setStatus('connecting…');
  listen();
});

listen();
</script>
</body>
</html>
